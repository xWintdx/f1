[project]
name = "f1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RB", email = "rbaydushin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
f1 = "f1:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
